[package]
name = "guru-core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "now"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rust_decimal = { version = "1.43.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
ureq = "3.5.0"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
